        <h2>11. Conclusion</h2>
        <p>USMT bridges physical lab-grown diamonds with DeFi liquidity. The infrastructure is live. The mission is clear.</p>
    `,
    ru: `
        <h2>1. Резюме</h2>
        <p>USMT — утилитарный токен на Solana для токенизации рынка лабораторных бриллиантов ($64 млрд).</p>
        <h2>2. Проблема и решение</h2>
        <p>Медленные跨境платежи → мгновенные расчёты на Solana.</p>

        <p>10B USMT, ликвидность $592.9M на Meteora, привязка к USDC.</p>

        <p>Турция, Монголия, Словакия, Казахстан, Узбекистан, Россия и другие.</p>
        <h2>5. Партнёры</h2>
        <p>Diamond Foundry, Brilliant Earth, Ada Diamonds, Clean Origin, Solana, Meteora, Jupiter.</p>
    `
};
for(let lang of ['tr','mn','sk','kk','uz','ar']) wpContent[lang] = wpContent.en;
let currentLang = 'en';
function setLanguage(lang) {
    currentLang = lang;
    const t = wpContent[lang] || wpContent.en;
    document.getElementById('wpContent').innerHTML = t;
    document.getElementById('langSwitcher').innerHTML = `🌐 ${lang.toUpperCase()}`;
    localStorage.setItem('usmt_wp_lang', lang);
}
document.getElementById('langSwitcher').onclick = () => document.getElementById('langMenu').classList.toggle('show');
document.querySelectorAll('.lang-menu a').forEach(a => a.onclick = (e) => { e.preventDefault(); setLanguage(a.dataset.lang); document.getElementById('langMenu').classList.remove('show'); });
document.onclick = (e) => { if (!e.target.closest('.lang-switcher') && !e.target.closest('.lang-menu')) document.getElementById('langMenu').classList.remove('show'); };
setLanguage(localStorage.getItem('usmt_wp_lang') || 'en');
</script>
